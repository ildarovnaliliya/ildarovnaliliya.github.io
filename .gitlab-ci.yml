# Совместимый статический Pages job: GitLab 17.9+ / GitLab.com
create-pages:
  image: alpine:3.21
  stage: deploy
  script:
    - mkdir -p public
    - cp index.html price.html style.css app.js config.js catalog.js public/
    - cp -r assets public/
  artifacts:
    paths:
      - public
  pages:
    publish: public
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
